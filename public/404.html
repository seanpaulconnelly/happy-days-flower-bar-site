<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        background: #f7f2ea;
        color: #26231f;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
      }
      a {
        color: #435b47;
      }
    </style>
  </head>
  <body>
    <h1>Page not found</h1>
    <!-- The href is rewritten to the build's base path in dist/ by the
         `happy-days-404-base` plugin in vite.config.ts (QA-3): before the DNS
         cutover the site lives under /happy-days-flower-bar-site/, where "/"
         would send the visitor to a different site. Keep the id and the exact
         `href="/"` spelling — the plugin matches this element literally and
         fails the build if it stops finding it. -->
    <p><a id="home-link" href="/">Return to the home page</a></p>
  </body>
</html>
