name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs `pages: write` + `id-token: write` for deploy-pages,
# and `contents: read` to check the repo out.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A healthy build+check is ~2 minutes; anything longer is a hang, not work.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run check` ends in check:copy, which reads the rendered DOM under
      # `vite preview` with Playwright. npm ci installs the library but not the
      # browser binary, so fetch Chromium (cached layer, ~40 s) before checking.
      - name: Install Chromium for the copy check
        run: npx playwright install --with-deps chromium

      # Enables Pages on the first run so nobody has to click Settings -> Pages.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      # Until the custom domain lands (public/CNAME), the site is served from
      # https://<owner>.github.io/<repo>/ and Vite needs that sub-path as `base`.
      - name: Resolve base path
        run: |
          if [ -f public/CNAME ]; then echo "BASE_PATH=/" >> "$GITHUB_ENV";
          else echo "BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"; fi

      # typecheck -> lint -> check:config -> vite build -> check:copy.
      # --allow-todos downgrades unresolved TODO_ placeholders in site.ts to a
      # warning; drop the flag once the inquiry endpoint is set.
      - run: npm run check

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
