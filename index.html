<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The title below is replaced, and the description, canonical/robots,
         OG/Twitter, JSON-LD and the hero preload links are appended, by the
         `happy-days-seo-head` plugin in vite.config.ts at build time (request
         SEO-1). React renders no metadata. Do not add a description here — the
         plugin owns it, and two would be a regression `check-seo` fails on. -->
    <title>Pop-Up Flower Bars in Pittsburgh, PA | Happy Days Flower Farm</title>
    <!-- Icons (request Q3). Vite rewrites root-relative hrefs in index.html
         against `base`, so these work under /happy-days-flower-bar-site/ too.
         apple-touch-icon.png is rendered from favicon.svg by `npm run images`. -->
    <meta name="theme-color" content="#F7F2EA" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
